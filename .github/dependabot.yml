version: 2

updates:
  # Keep GitHub Actions pinned to commit-SHA (per SEC-06, post Plan 06.1-01).
  # Dependabot bumps the SHA AND the trailing `# vX.Y.Z` comment in lockstep
  # since Oct 2022 [https://github.blog/changelog/2022-10-31-dependabot-now-updates-comments-in-github-actions-workflows-referencing-action-versions/];
  # behaviour extended Oct 2025 to also CORRECT stale comments when the SHA
  # advances without a tag rename. Maintainers should NOT manually edit the
  # `# vX.Y.Z` comment — let Dependabot do it; manual edits cause merge
  # conflicts on the next Dependabot bump.
  #
  # Grouping (added by Plan 06.1-05): minor + patch SHA bumps coalesce into
  # ONE weekly PR. Major-version bumps stay in separate PRs (they need
  # attention; the breaking-change surface is larger). Without grouping,
  # each pinned action would emit its own weekly PR — review fatigue +
  # queue bloat. (P6.1-R-11: dropped brittle count phrasing — actual
  # pinned-action count drifts as the workflow surface grows.)
  #
  # LuaRocks is not supported by Dependabot, and there is no LuaRocks
  # ecosystem in OSV.dev or the GitHub Advisory Database either, so there is
  # no vulnerability feed to subscribe to for that surface.
  #
  # An earlier version of this comment claimed the Lua tooling was "pinned by
  # the rockspec resolution at install time" while CI "installs the latest
  # published version of each tool". Those two claims contradict each other,
  # and the second one was the true one: ci.yml ran four bare
  # `luarocks install <name>` lines, so the toolchain floated to whatever was
  # newest at job start — unpinned and unauditable.
  #
  # That is now fixed outside Dependabot:
  #   * moneymoney-paypal-pos-extension-dev-1.rockspec pins busted, luacheck,
  #     luacov and dkjson to exact version-revisions, and CI installs from it
  #     via `luarocks install --only-deps`.
  #   * .github/workflows/lua-toolchain-audit.yml runs weekly, compares each
  #     pin against luarocks.org and files a tracking issue on drift.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # ── Python CI toolchain (Semgrep, MkDocs + plugins) ─────────────────────
  #
  # S-02 follow-up. requirements/{docs,sast}.txt are pip-compile output,
  # generated from requirements/{docs,sast}.in. `allow: dependency-type:
  # direct` is what keeps Dependabot to the three top-level pins (mkdocs,
  # mkdocs-material, semgrep) and off the ~300 transitive entries.
  #
  # That only works if Dependabot RECOGNISES the .txt as a compiled
  # lockfile. It pairs them by basename: PipCompileFileMatcher#
  # manifest_for_lockfile_name strips `.txt` and looks for `<basename>.in`
  # (dependabot-core, python/lib/dependabot/python/
  # pip_compile_file_matcher.rb); the alternate route matches
  # `--output-file=<name>` against the file's Dependabot-relative name.
  # While these files were named `sast.lock.txt` / `docs.lock.txt`, the
  # basename lookup was for `sast.lock.in` — which does not exist — and the
  # header wrote `--output-file=requirements/sast.lock.txt`, which does not
  # match the directory-relative `sast.lock.txt` under
  # `directory: /requirements`. Both routes failed, so file_parser.rb never
  # assigned `requirements: []` (its non-top-level marker), every pinned
  # line parsed as top-level, `allow: direct` filtered nothing, and
  # Dependabot emitted single-line bumps that no resolver would produce —
  # PRs #74-#77 on 2026-08-24, the same class the #66 comment predicted but
  # could not actually prevent. Both workflows install with
  # `--require-hashes --no-deps`, so CI could not catch the corruption.
  #
  # DO NOT rename these files back to `*.lock.txt`. The `.in` -> `.txt`
  # basename pairing is load-bearing.
  #
  # Semgrep pins exact/compatible versions of its deps (mcp==1.29.0,
  # peewee~=3.14, boltons~=21.0, wcmatch~=8.3, opentelemetry-*~=1.37.0),
  # so transitives must move by re-resolution when a top-level pin bumps —
  # never by editing a lock line.
  #
  # Note on `ignore`: deliberately NOT used to silence transitives. Ignore
  # rules also apply to Dependabot security updates, so a blanket ignore
  # would mute a genuine advisory on a transitive.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    allow:
      - dependency-type: direct
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - python
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
